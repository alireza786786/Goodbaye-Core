name: V2Ray Collector

on:
  schedule:
    - cron: '0 */6 * * *'        # هر ۶ ساعت
  workflow_dispatch:             # دکمهٔ دستی

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run collector
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          XRAY_ARCH: Xray-linux-64.zip
        run: python3 collector.py

      - name: Upload subscription artifacts
        uses: actions/upload-artifact@v4
        with:
          name: subscriptions
          path: subscription_part*.txt
          if-no-files-found: error

      - name: Commit updated subscriptions back to repo
        run: |
          git config user.name "collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add subscription_part*.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update smart subscriptions $(date -u +'%Y-%m-%d %H:%M')"
            git push
          else
            echo "no changes to commit"
          fi